<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | Kapazz Bitcoin</title>
    <link rel="shortcut icon" href="assets/icons/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', Arial, sans-serif;
            color: #fff;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: blur(1px) brightness(0.6);
        }

        .card {
            background: rgba(20, 20, 25, 0.7);
            border: 1px solid rgba(247, 147, 26, 0.4);
            border-top: 3px solid #f7931a;
            border-radius: 16px;
            padding: 50px 36px;
            max-width: 420px;
            margin: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .code {
            font-size: 72px;
            font-weight: 800;
            background: linear-gradient(135deg, #f7931a, #ffb84d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1;
        }

        h1 {
            font-size: 20px;
            margin: 16px 0 8px 0;
        }

        p {
            font-size: 14px;
            color: #ccc;
            line-height: 1.6;
            margin: 0 0 26px 0;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 30px;
            background: linear-gradient(135deg, #f7931a, #ffb347);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(247, 147, 26, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 26px rgba(247, 147, 26, 0.5);
        }
    </style>
</head>

<body>
    <video autoplay muted loop playsinline class="bg-video">
        <source src="assets/video/bg-video.mp4" type="video/mp4">
    </video>

    <div class="card">
        <p class="code">404</p>
        <h1>Halaman Tidak Ditemukan</h1>
        <p>Sepertinya halaman yang kamu cari tidak ada, sudah dipindah, atau alamatnya salah ketik.</p>
        <a href="/" class="home-btn">← Kembali ke Beranda</a>
    </div>
</body>

</html>
