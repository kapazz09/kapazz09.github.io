name: Update Bitcoin News

on:
  schedule:
    # 01:41 UTC setiap hari. Menit tidak bulat dan beda jam dari workflow harga
    # (00:28 UTC) supaya dua workflow tidak berebut push di waktu yang sama.
    - cron: '41 1 * * *'
  workflow_dispatch: {}   # bisa dijalankan manual lewat tab Actions > Run workflow

permissions:
  contents: write   # perlu izin tulis supaya bisa commit & push balik ke repo

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ambil berita (judul + tautan saja)
        run: node .github/scripts/fetch-news.mjs

      - name: Commit & push kalau ada perubahan
        run: |
          if git diff --quiet -- data/bitcoin-news.json; then
            echo "Tidak ada perubahan pada data/bitcoin-news.json, tidak perlu commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bitcoin-news.json
          git commit -m "chore: update bitcoin-news.json (otomatis)"
          # Workflow harga BTC juga push ke branch ini: tarik dulu lalu coba lagi kalau bentrok
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push gagal (percobaan $i), mencoba lagi..."
            sleep 5
          done
          echo "Push gagal setelah 3 percobaan"
          exit 1
